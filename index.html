<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Học Tiếng Trung 60 Ngày</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Bố cục: một cột hẹp, mỗi màn một việc, thanh tab dưới cùng, nút lớn cho ngón tay cái.
   Màu: nền xám xanh nhạt, mực than, ngọc bích làm điểm nhấn, đỏ son chỉ dùng cho chữ Hán nổi bật và cảnh báo. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface2:#e9eeea; --ink:#18221f; --ink2:#52615c; --line:#d5ddd8;
  --jade:#0d7a68; --jade-ink:#ffffff; --jade-soft:#d6ece6;
  --seal:#b4332a; --amber:#8a5a00; --amber-soft:#f6e8c8; --ok:#1c7a43; --ok-soft:#d8efe0; --bad:#b4332a; --bad-soft:#f6dcd9;
  --sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --han:'Noto Sans SC','PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#1a2420; --surface2:#222f2a; --ink:#e7efec; --ink2:#a2b3ac; --line:#32423c;
  --jade:#3cc2a8; --jade-ink:#06231d; --jade-soft:#18382f;
  --seal:#ee8a80; --amber:#e8b95a; --amber-soft:#3a2f14; --ok:#6fd195; --ok-soft:#173826; --bad:#ee8a80; --bad-soft:#40201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#1a2420; --surface2:#222f2a; --ink:#e7efec; --ink2:#a2b3ac; --line:#32423c;
  --jade:#3cc2a8; --jade-ink:#06231d; --jade-soft:#18382f;
  --seal:#ee8a80; --amber:#e8b95a; --amber-soft:#3a2f14; --ok:#6fd195; --ok-soft:#173826; --bad:#ee8a80; --bad-soft:#40201d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
#app{max-width:600px;margin:0 auto;padding-top:18px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:1.55rem;font-weight:700} h2{font-size:1.2rem;font-weight:600} h3{font-size:1rem;font-weight:600}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.sp{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.hero{border-color:var(--jade);border-width:2px}
.card.warn{background:var(--amber-soft);border-color:transparent;color:var(--ink)}
.card.bad{background:var(--bad-soft);border-color:transparent}
.card.good{background:var(--ok-soft);border-color:transparent}
.muted{color:var(--ink2);font-size:.92rem}
.small{font-size:.85rem}
.eyebrow{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:15px 18px;min-height:52px;background:var(--jade);color:var(--jade-ink);cursor:pointer;width:100%;text-align:center}
.btn.sec{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--jade);border:1.5px solid var(--jade)}
.btn.sm{width:auto;min-height:44px;padding:10px 14px;font-size:.92rem}
.btn.dng{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.tab:focus-visible,.chip:focus-visible,.daycell:focus-visible,.tok:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
.rate{display:grid;grid-template-columns:1fr;gap:10px}
.rate .btn{text-align:left;display:flex;justify-content:space-between;align-items:center}
.rate .r0{background:var(--bad-soft);color:var(--bad)} .rate .r1{background:var(--amber-soft);color:var(--amber)} .rate .r2{background:var(--ok-soft);color:var(--ok)}
.hz{font-family:var(--han);font-size:2.3rem;line-height:1.3;font-weight:500;letter-spacing:.02em}
.hz.s{font-size:1.5rem}
.py{color:var(--jade);font-size:1.12rem;font-weight:500}
.vi{color:var(--ink);font-size:1.02rem}
.mask{display:inline-block;background:var(--surface2);color:transparent;border-radius:8px;padding:2px 12px;cursor:pointer;user-select:none;border:1px dashed var(--line);min-width:90px;text-align:center;position:relative}
.mask::after{content:"bấm để xem";color:var(--ink2);font-size:.82rem;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--sans)}
.opt{font:inherit;text-align:left;background:var(--surface);border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:14px 16px;min-height:52px;cursor:pointer;width:100%}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)} .opt.no{background:var(--bad-soft);border-color:var(--bad)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabbar .in{display:flex;max-width:600px;width:100%;gap:4px}
.tab{flex:1;font:inherit;font-size:.78rem;font-weight:600;background:none;border:0;color:var(--ink2);padding:8px 2px;border-radius:10px;cursor:pointer;min-height:48px}
.tab[aria-current="page"]{color:var(--jade);background:var(--jade-soft)}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)} .steps i.on{background:var(--jade)} .steps i.cur{background:var(--jade);opacity:.5}
.chip{display:inline-block;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--ink2);border:0;font-family:inherit}
.chip.done{background:var(--ok-soft);color:var(--ok)} .chip.due{background:var(--amber-soft);color:var(--amber)} .chip.redo{background:var(--bad-soft);color:var(--bad)} .chip.test{background:var(--jade-soft);color:var(--jade)}
.dayrow{display:flex;gap:12px;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;min-height:56px}
.dayrow .n{font-weight:700;min-width:38px;font-size:1.05rem;color:var(--jade)}
.dayrow .t{flex:1;min-width:0}
.dayrow.next{border-color:var(--jade);border-width:2px}
.bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden} .bar>i{display:block;height:100%;background:var(--jade)}
.bar.w>i{background:var(--amber)} .bar.b>i{background:var(--bad)}
.tokbox{min-height:64px;border:1.5px dashed var(--line);border-radius:12px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tok{font:inherit;font-family:var(--han);font-size:1.25rem;background:var(--surface2);border:1px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer;min-height:48px}
.tok.used{opacity:.25;pointer-events:none}
.line{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)} .line:first-child{border-top:0}
.line .who{font-weight:700;color:var(--jade);min-width:20px}
label.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-height:52px}
label.tg:first-of-type{border-top:0}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--jade)}
input[type=date],input[type=time],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;max-width:100%}
textarea{width:100%;min-height:90px;font-size:.82rem}
.num{font-variant-numeric:tabular-nums}
.big{font-size:2rem;font-weight:700}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv>div{background:var(--surface2);border-radius:12px;padding:12px}
.kv b{display:block;font-size:1.5rem}
.sc{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.92rem;z-index:9;max-width:92vw}
audio{width:100%}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
hr{border:0;border-top:1px solid var(--line);width:100%;margin:2px 0}
details summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-weight:700;color:var(--jade);font-size:1rem}
.link{font:inherit;font-size:.92rem;font-weight:600;color:var(--jade);background:none;border:0;padding:10px 4px;min-height:44px;cursor:pointer}
.vthumb{position:relative;display:block;border-radius:14px;overflow:hidden;aspect-ratio:16/9;border:1px solid var(--line);margin:8px 0 10px;background:var(--surface2)}
.vthumb{background:linear-gradient(135deg,#1f2a28,#33443f);color:#fff;text-decoration:none;padding:12px 14px}
.vthumb .vch{display:none}
.vthumb .vtt{position:absolute;left:14px;right:78px;bottom:12px;font-weight:700;font-size:1rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vthumb .ytplay{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:64px;height:44px;border-radius:12px;background:#c4302b;display:flex;align-items:center;justify-content:center}
.vthumb .ytplay svg{width:24px;height:24px;color:#fff;margin-left:3px}
.vthumb .dur{position:absolute;right:8px;bottom:8px}
.vthumb .yt{position:absolute;left:14px;top:12px;background:#c4302b;color:#fff;font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:6px}
.vframe{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;margin:8px 0 10px;background:#000}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vt{font-weight:700;line-height:1.35;margin:0 0 2px}
.scenebox{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/9;background:var(--surface2);border:1px solid var(--line)}
.scene{display:block;width:100%;height:100%}
.thumb{width:84px;flex:none;aspect-ratio:16/9;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.ico{width:112px;height:112px;margin:0 auto;background:var(--surface2);border-radius:22px;padding:12px;flex:none}
.ico svg,.picopt svg{display:block;width:100%;height:100%}
.ico.sm{width:64px;height:64px;padding:6px;border-radius:16px}
.picgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.picopt{font:inherit;aspect-ratio:1;background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:12px;cursor:pointer;color:var(--ink)}
.picopt{width:100%;display:block}
.picopt.sc{aspect-ratio:16/9;padding:0;overflow:hidden}
.picopt.sc svg{width:100%;height:100%}
.picgrid.one{grid-template-columns:1fr}
.picopt.ok{border-color:var(--ok);background:var(--ok-soft)} .picopt.no{border-color:var(--bad);background:var(--bad-soft)}
.picopt:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
.playbig{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:0;background:var(--jade);color:var(--jade-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.playbig svg{width:34px;height:34px;margin-left:4px}
.dur{position:absolute;right:10px;bottom:10px;background:rgba(20,30,28,.78);color:#fff;font-weight:600}
.bub{background:var(--surface2);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.bub.b{background:var(--jade-soft)}
.who{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--jade);color:var(--jade-ink);font-weight:700;font-size:.82rem;flex:none}
.tonegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tonebtn{font:inherit;background:var(--surface2);border:1.5px solid var(--line);border-radius:14px;padding:8px 4px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:96px}
.tonebtn svg{width:100%;height:46px}
.tokv{font:inherit;font-family:var(--han);font-size:1.25rem;background:var(--surface2);border:1.5px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:10px;cursor:pointer;min-height:46px}
.tokv.on{border-color:var(--jade);background:var(--jade-soft)}
.chang{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.chang.cur{border-color:var(--jade);border-width:2px}
.changhead{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;font:inherit;color:var(--ink);text-align:left;padding:12px;cursor:pointer;min-height:76px}
.changhead .thumb{width:84px;flex:none}
.changhead .ctitle{display:block;font-size:1.02rem;line-height:1.3;margin-top:2px}
.dayrow .thumb{width:60px;flex:none}
.dayrow .dtitle{display:block;font-size:1rem;line-height:1.3;margin:2px 0 6px}
.dayrow .t .muted{display:block}
.days{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;align-items:end;height:96px}
.week div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:.7rem;min-width:0}
.week i{display:block;width:100%;background:var(--jade);border-radius:6px 6px 0 0;min-height:4px}
.tab svg{display:block;margin:0 auto 2px;width:22px;height:22px}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
.sp0 .p0,.sp1 .p1{animation:bob .45s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){.sp0 .p0,.sp1 .p1{animation:none}}
@media (prefers-reduced-motion:no-preference){.card,.btn{transition:background .15s,border-color .15s}}
@media (max-width:380px){.hz{font-size:2rem}.sc{grid-template-columns:78px 1fr 40px}}
</style>

{d:2,ty:"learn",t:"Xin lỗi và lịch sự",g:"Biết xin lỗi, đáp lại lời xin lỗi và mời ai đó ngồi.",sc:"Bạn đến họp muộn vài phút.",

var ART=(function(){
var K={ink:'#2b3a36',white:'#ffffff',jade:'#0d7a68',jade2:'#8fd0c0',sky:'#d6ecf7',sky2:'#b9ddf0',wall:'#f8ecd8',floor:'#e6d6bb',red:'#d9483b',orange:'#f09a45',yellow:'#f7c948',green:'#67b26f',blue:'#5a9fd6',navy:'#33506f',gray:'#c5cdca',dgray:'#7b8884',skinA:'#f1c7a0',skinB:'#dca47a',hairA:'#2a2320',hairB:'#4a2f22',pink:'#f3a9b4',cream:'#fff6e5'};
function R(x,y,w,h,f,rx,s){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(rx||0)+'" fill="'+f+'"'+(s?' stroke="'+s+'" stroke-width="2"':'')+'/>'}
function C(x,y,r,f,s){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+f+'"'+(s?' stroke="'+s+'" stroke-width="2"':'')+'/>'}
function P(d,f,s,w){return '<path d="'+d+'" fill="'+(f||'none')+'"'+(s?' stroke="'+s+'" stroke-width="'+(w||2.5)+'" stroke-linecap="round" stroke-linejoin="round"':'')+'/>'}
function G(t,inner,cls){return '<g'+(cls?' class="'+cls+'"':'')+' transform="'+t+'">'+inner+'</g>'}
function T(x,y,s,size,f){return '<text x="'+x+'" y="'+y+'" font-size="'+size+'" font-weight="700" fill="'+f+'" text-anchor="middle" font-family="Be Vietnam Pro,Arial,sans-serif">'+s+'</text>'}
function star(cx,cy,r,f){var p=[];for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*0.4:r;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return '<polygon points="'+p.join(' ')+'" fill="'+f+'"/>'}

var Sync={ref:null,state:'off',busy:false,again:false,t:null,last:0};
function syncPush(){
  if(!Sync.ref)return;clearTimeout(Sync.t);
  Sync.t=setTimeout(function(){
    if(Sync.busy){Sync.again=true;return}
    var copy=JSON.parse(JSON.stringify(st));copy.sess=st.sess||null;
    Sync.busy=true;
    Sync.ref.set({json:JSON.stringify(copy),savedAt:st.savedAt||Date.now()}).then(function(){Sync.state='ok';Sync.last=Date.now()},function(){Sync.state='err'}).then(function(){Sync.busy=false;if(Sync.again){Sync.again=false;syncPush()}});
  },1500);
}
function adopt(json){
  try{var o=JSON.parse(json),s=defState();for(var k in o){if(k==='set'){for(var j in o.set)s.set[j]=o.set[j]}else s[k]=o[k]}st=s;try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}return true}catch(e){return false}
}
function syncInit(){
  try{if(!(window.claude&&claude.use))return}catch(e){return}
  Promise.all([claude.use('db'),claude.use('user')]).then(function(r){
    var db=r[0],u=r[1];if(!db||!u)return;
    return Promise.resolve(u.id()).then(function(id){
      if(!id)return;
      Sync.ref=db.collection('data/users/'+id).doc('state');Sync.state='wait';
      var timer=setTimeout(function(){if(Sync.state==='wait')Sync.state='err'},10000);
      return Sync.ref.get().then(function(snap){
        clearTimeout(timer);
        var d=snap&&typeof snap.data==='function'?snap.data():(snap&&snap.data!==undefined?snap.data:snap);
        if(d&&d.json&&(d.savedAt||0)>(st.savedAt||0)){
          if(!S&&adopt(d.json)){Sync.state='ok';toast('Đã lấy tiến độ mới nhất từ tài khoản của bạn.');render();return}
        }
        Sync.state='ok';syncPush();
      },function(){clearTimeout(timer);Sync.state='err'});
    });
  }).catch(function(){Sync.state='err'});
}

var zhVoice=null,ttsCap=null;
function loadVoices(){
  if(!window.speechSynthesis)return;
  var vs=speechSynthesis.getVoices()||[];
  var zh=vs.filter(function(v){return /^zh/i.test(v.lang)||/chinese|中文|普通话|Huihui|Yaoyao|Kangkang/i.test(v.name)});
  zh.sort(function(a,b){return (/zh[-_]CN/i.test(b.lang)?1:0)-(/zh[-_]CN/i.test(a.lang)?1:0)});
  zhVoice=zh[0]||null;
}
loadVoices();
if(window.speechSynthesis){try{speechSynthesis.onvoiceschanged=function(){loadVoices();if(!S&&UI.tab==='settings')render()}}catch(e){}}
try{if(window.claude&&claude.use){claude.use('tts').then(function(t){ttsCap=t||null}).catch(function(){})}}catch(e){}
function hasVoice(){return !!(zhVoice||ttsCap)}
function clean(t){return String(t).replace(/[…·]/g,'')}
function speakP(text,slow){
  text=clean(text);
  return new Promise(function(res){
    var done=false;function fin(){if(!done){done=true;res()}}
    var est=Math.max(1200,text.length*(slow?650:420)+800);
    if(zhVoice){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=zhVoice.lang||'zh-CN';u.voice=zhVoice;u.rate=slow?0.55:0.9;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);setTimeout(fin,est+3000);return}catch(e){}}
    if(ttsCap){ttsCap.speak(text,{language:'zh-CN',rate:slow?0.7:1}).then(fin,fin);setTimeout(fin,est+6000);return}
    setTimeout(fin,est);
  });
}
function say(text,slow){
  if(!hasVoice()){toast('Thiết bị chưa có giọng tiếng Trung. Mở Cài đặt để xem cách bật.');return}
  speakP(text,slow);
}

var Rec={mr:null,state:'idle',url:'',msg:''};
function recReset(){if(Rec.mr&&Rec.state==='rec'){try{Rec.mr.stop()}catch(e){}}Rec.state='idle';Rec.url='';Rec.msg=''}
function recToggle(){
  if(Rec.state==='rec'){Rec.mr.stop();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){Rec.msg='Trình duyệt này không hỗ trợ ghi âm. Bạn vẫn có thể nhại theo và tự đánh giá.';render();return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var ch=[];var mr=new MediaRecorder(stream);Rec.mr=mr;
    mr.ondataavailable=function(e){if(e.data&&e.data.size)ch.push(e.data)};
    mr.onstop=function(){stream.getTracks().forEach(function(t){t.stop()});if(Rec.state==='rec'){Rec.url=URL.createObjectURL(new Blob(ch,{type:mr.mimeType||'audio/webm'}));Rec.state='ready';render()}};
    mr.start();Rec.state='rec';Rec.msg='';render();
  }).catch(function(){Rec.state='idle';Rec.msg='Không mở được micro. Có thể bạn chưa cấp quyền. Hãy dùng nút «Dùng app ghi âm» bên dưới, hoặc nhại theo và tự đánh giá.';Rec.fb=1;render()});
}

/* ---------- lặp lại ngắt quãng ---------- */
function fac(e){return e.lapses>=2?0.6:1}
function ensure(id){return st.srs[id]||(st.srs[id]={stage:0,due:addDays(today(),1),lapses:0,reps:0,last:-1,seen:today()})}
function pushRecent(v){st.recent.push(v);if(st.recent.length>40)st.recent.shift()}
function rate(id,r,init){
  var e=ensure(id),t=today();e.last=r;
  if(init){e.due=addDays(t,1);if(r===0)e.lapses++;pushRecent(r===2?1:r===1?0.5:0);return}
  e.reps++;
  if(r===0){e.stage=0;e.lapses++;e.due=addDays(t,1)}
  else if(r===1){e.due=addDays(t,Math.max(1,Math.round(INT[e.stage]*fac(e)/2)))}
  else{e.stage=Math.min(4,e.stage+1);e.due=addDays(t,Math.max(1,Math.round(INT[e.stage]*fac(e))))}
  pushRecent(r===2?1:r===1?0.5:0);
}
function quizMark(id,ok){
  if(!ITEMS[id]||ITEMS[id].k==='l')return;
  var e=ensure(id);pushRecent(ok?1:0);
  if(!ok){e.lapses++;e.last=0;e.stage=0;var tm=addDays(today(),1);if(e.due>tm)e.due=tm}
}
function dueIds(limit){
  var t=today(),a=[];for(var id in st.srs){if(st.srs[id].due<=t&&ITEMS[id])a.push(id)}
  a.sort(function(x,y){var ex=st.srs[x],ey=st.srs[y];return (ey.lapses-ex.lapses)||(ex.due<ey.due?-1:ex.due>ey.due?1:0)});
  return limit?a.slice(0,limit):a;
}
function isWeak(e){return e.last===0||(e.lapses>=3&&e.stage<=1)}
function weakIds(){var a=[];for(var id in st.srs){if(ITEMS[id]&&isWeak(st.srs[id]))a.push(id)}a.sort(function(x,y){return st.srs[y].lapses-st.srs[x].lapses});return a}
function recentAcc(){if(st.recent.length<10)return null;var r=st.recent.slice(-20),s=0;r.forEach(function(v){s+=v});return s/r.length}
function remembered(e){return e.stage>=2&&e.last===2}
function nextDay(){for(var d=1;d<=60;d++)if(!st.done[d])return d;return 61}
function dayStatus(d){
  var D=dayOf(d);if(!st.done[d])return 'new';
  if(D.ty!=='learn')return 'done';
  var w=0,due=false,t=today();D.ids.forEach(function(id){var e=st.srs[id];if(e){if(isWeak(e))w++;if(e.due<=t)due=true}});
  if(w/D.ids.length>=0.4)return 'redo';
  return due?'due':'done';
}
function backlog(){var n=dueIds().length,acc=recentAcc();return {n:n,acc:acc,heavy:n>20||(acc!==null&&acc<0.5)||st.consol}}
function schedDate(d){
  if(st.done[d])return st.done[d].date;
  var nd=nextDay(),base=(st.lastDone===today())?addDays(today(),1):today();
  base=maxStr(base,st.start);return addDays(base,d-nd);
}

function ssLabel(s){return 'Ngày '+s.day+' · '+STEPN[s.steps[s.si]]+' (bước '+(s.si+1)+' / '+s.steps.length+')'}
function sentenceOfDay(){
  var ids=[];for(var d=1;d<=60;d++){if(st.done[d]&&dayOf(d).ids)dayOf(d).ids.forEach(function(i){if(ITEMS[i].k==='s')ids.push(i)})}

  var n=0,t=today();for(var i=0;i<t.length;i++)n+=t.charCodeAt(i);

}

function speakStats(){var n=0,g=0;for(var id in st.speak){st.speak[id].forEach(function(r){n++;if(r===2)g++})}return {n:n,good:g}}

function latestTest(){var ks=Object.keys(st.tests).map(Number).sort(function(a,b){return b-a});return ks.length?{d:ks[0],t:st.tests[ks[0]]}:null}

function tg(k,l){return '<label class="tg"><span>'+l+'</span><input type="checkbox" '+(st.set[k]?'checked':'')+' onchange="A.tg(\''+k+'\',this.checked)"></label>'}

/* ================= PHIÊN HỌC ================= */
function startSession(mode,day){
  clipStop();recReset();exitAsk=false;
  day=day||nextDay();var D=dayOf(Math.min(day,60));
  S={mode:mode,day:day,si:0,ci:0,li:0,qi:0,pi:0,rev:0,revealed:false,picked:null,arr:null,tokSel:null,res:{},rr:[],req:{},tried:{}};
  if(mode==='full'){
    var pre=dueIds(6);S.dueQ=pre;S.steps=(pre.length?['due']:[]).concat(['look','video','hear','pic','speak','talk','test','recall','result']);
    S.lq=D.ids.slice();S.sh=D.ids.filter(function(i){return ITEMS[i].k==='s'}).concat(D.lines);S.q=buildQuiz(day);S.pq=buildPic(day);S.tq=buildTalk(day);S.rq=D.ids.filter(function(i){return ITEMS[i].k==='w'});
  }else if(mode==='busy'){
    var dq=dueIds(6);if(!dq.length)dq=recentIds(3);S.dueQ=dq;S.steps=['due','speak','result'];S.sh=busySentences();
  }else if(mode==='review'){
    S.dueQ=dueIds(15);S.steps=['due','result'];
  }else if(mode==='consol'){
    var w=weakIds().slice(0,8),dq2=dueIds(8);w.forEach(function(i){if(dq2.indexOf(i)<0)dq2.push(i)});
    S.dueQ=dq2.slice(0,10);S.steps=['due','test','result'];S.q=buildQuizFrom(S.dueQ.length?S.dueQ:recentIds(6),5);
  }else{
    S.steps=['due','test','speak','result'];S.dueQ=dueIds(8);S.T=buildTest(S.day);
  }
  render();
}
function recentIds(n){var ids=[];for(var d=60;d>=1&&ids.length<n;d--){if(st.done[d]&&dayOf(d).ids)dayOf(d).ids.forEach(function(i){if(ids.length<n&&ITEMS[i].k==='w')ids.push(i)})}if(!ids.length)ids=['d1w0','d1w1','d1w2'];return ids}
function busySentences(){
  var ids=[];for(var d=60;d>=1&&ids.length<2;d--){if(st.done[d]&&dayOf(d).ids)dayOf(d).ids.forEach(function(i){if(ITEMS[i].k==='s'&&ids.length<2)ids.push(i)})}
  if(!ids.length)ids=['d1s0','d1s1'];return ids;
}
function step(){return S.steps[S.si]}
function resetStep(){S.ci=0;S.li=0;S.pi=0;S.qi=0;S.revealed=false;S.rev=0;S.picked=null;S.arr=null;S.tokSel=null;recReset();clipStop()}
function sessionHTML(){
  var st_=step(),total=S.steps.length;
  var h='<div class="stack"><div class="row sp">'+(S.si>0&&st_!=='result'?'<button class="btn sm sec" onclick="A.back()">Quay lại</button>':'<span></span>')+(st_==='result'?'<span></span>':exitAsk?'<span class="row"><button class="btn sm" onclick="A.exit(\'save\')">Lưu và thoát</button><button class="btn sm sec" onclick="A.exit(0)">Ở lại</button></span>':'<button class="btn sm sec" onclick="A.exit()">Thoát</button>')+'</div>';
  h+='<div class="steps" aria-label="Tiến độ bài học">'+S.steps.map(function(x,i){return '<i class="'+(i<S.si?'on':i===S.si?'cur':'')+'"></i>'}).join('')+'</div>';
  if(exitAsk)h+='<div class="card warn small">Bài đang học sẽ được giữ lại. Lần sau bạn bấm «Tiếp tục bài đang học dở» ở màn Hôm nay. <button class="link" onclick="A.exit(\'drop\')">Hoặc bỏ bài này</button></div>';
  if(st_!=='result'){
    var nm=(st_==='due'&&S.mode==='review')?'Ôn tập':(st_==='due'&&S.mode==='busy')?'Ôn mục quan trọng':STEPN[st_];
    h+='<div><div class="eyebrow">'+(S.mode==='busy'?'Ngày bận · ':S.mode==='consol'?'Củng cố · ':S.mode==='review'?'':'Ngày '+S.day+' · ')+'Bước '+(S.si+1)+' / '+total+'</div><h1>'+nm+'</h1></div>';
  }
  switch(st_){
    case 'due':h+=cardsHTML('due');break;
    case 'recall':h+=cardsHTML('recall');break;
    case 'look':h+=lookHTML();break;
    case 'video':h+=videoHTML();break;
    case 'hear':h+=hearHTML();break;
    case 'pic':case 'talk':case 'test':h+=quizHTML(qlist(),st_);break;
    case 'speak':h+=shadowHTML();break;
    default:h+=resultHTML();
  }
  return h+'</div>';
}
function qlist(){var s=step();return s==='pic'?S.pq:s==='talk'?S.tq:(S.mode==='test'?S.T.qs:S.q)}

/* --- 2. video hoạt hình tự tạo --- */
function clipLines(D){
  if(D.lines&&D.lines.length)return D.lines.map(function(id){var it=ITEMS[id];return {who:it.who,zh:it.zh,py:it.py,vi:it.vi}});
  var s=D.ids.filter(function(i){return ITEMS[i].k==='s'});
  return s.map(function(id,i){var it=ITEMS[id];return {who:i%2?'B':'A',zh:it.zh,py:it.py,vi:it.vi}});
}
function clipDur(L){var t=0;L.forEach(function(l){t+=Math.max(2.5,l.zh.length*0.5+1.5)});return t}
function clipStop(){Clip.gen++;Clip.on=false;Clip.idx=-1;try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}}
function clipPlay(){
  var D=dayOf(S.day),L=clipLines(D);Clip.lines=L;Clip.on=true;var gen=++Clip.gen,i=0;
  (function nxt(){
    if(gen!==Clip.gen)return;
    if(i>=L.length){Clip.on=false;Clip.idx=-2;render();return}
    Clip.idx=i;render();
    var p=hasVoice()?speakP(L[i].zh):new Promise(function(r){setTimeout(r,Math.max(2500,L[i].zh.length*500+1500))});
    p.then(function(){if(gen!==Clip.gen)return;setTimeout(function(){i++;nxt()},450)});
  })();
}
function videoHTML(){
  var D=dayOf(S.day),L=clipLines(D),dur=clipDur(L);
  var sp=Clip.idx>=0&&L[Clip.idx]?(L[Clip.idx].who==='A'?' sp0':' sp1'):'';
  var h=vidCard(S.day)+'<div class="eyebrow" style="margin-top:6px">Hoạt hình hội thoại của bài (ứng dụng tự tạo)</div><div class="scenebox clip'+sp+'">'+ART.scene(S.day);
  if(!Clip.on)h+='<button class="playbig" onclick="A.clip()" aria-label="'+(Clip.idx===-2?'Xem lại video':'Phát video')+'">'+PLAYSVG+'</button>';
  h+='<span class="chip dur num">'+mmss(dur)+'</span></div>';
  if(Clip.idx>=0&&L[Clip.idx]){var l=L[Clip.idx];h+='<div class="bub'+(l.who==='B'?' b':'')+'" aria-live="polite"><div class="row"><span class="who">'+l.who+'</span><span class="muted small">Lượt '+(Clip.idx+1)+' / '+L.length+'</span></div><div>'+fHz(l.zh,'s')+'</div><div>'+fPy(l.py)+'</div><div>'+fVi(l.vi)+'</div></div>'}
  else h+='<div class="card"><p class="muted small">'+L.length+' lượt thoại, dài khoảng '+mmss(dur)+'. Bấm nút phát: nhân vật lần lượt nói, mỗi lượt hiện chữ Hán, pinyin và nghĩa. '+(hasVoice()?'Giọng đọc do thiết bị của bạn phát.':'Thiết bị chưa có giọng tiếng Trung nên video chạy không tiếng, xem hướng dẫn ở Cài đặt.')+'</p></div>';
  if(Clip.on)h+='<button class="btn sec" onclick="A.clipStop()">Dừng video</button>';
  h+='<button class="btn" onclick="A.next()">Tiếp tục</button>';
  return h;
}

    }

function shadowHTML(){

function distract(id,n){
  var it=ITEMS[id],pool=[];for(var k in ITEMS){var o=ITEMS[k];if(o.k===it.k&&o.vi!==it.vi&&o.id!==id)pool.push(o.vi)}
  var uniq=[];shuffle(pool).forEach(function(v){if(uniq.indexOf(v)<0&&uniq.length<n)uniq.push(v)});return uniq;
}
function mkOpts(id,type,skill){var o=distract(id,3);o.push(ITEMS[id].vi);return {type:type,skill:skill,id:id,opts:shuffle(o)}}
function mkArr(id){var it=ITEMS[id],idx=it.zt.map(function(_,i){return i});return {type:'arrange',skill:'arrange',id:id,order:shuffle(idx)}}
function pickW(arr,n){
  var res=[],bag=arr.slice();
  while(res.length<n&&bag.length){
    var tot=0,ws=bag.map(function(id){var e=st.srs[id];var w=1+(e?e.lapses*2+(e.last===0?3:0)+(e.stage<=1?1:0):0);tot+=w;return w});
    var r=Math.random()*tot,k=0;while(k<bag.length-1&&r>ws[k]){r-=ws[k];k++}
    res.push(bag[k]);bag.splice(k,1);
  }
  return res;
}
function poolIds(range,onlyDone){
  var ids=[];for(var d=range[0];d<=range[1];d++){var D=dayOf(d);if(D&&D.ids&&(!onlyDone||st.done[d]))D.ids.forEach(function(i){ids.push(i)})}return ids;
}
function buildQuiz(day){
  var D=dayOf(day),ids=D.ids.slice(),old=poolIds([1,day-1],true);
  var w=ids.filter(function(i){return ITEMS[i].k==='w'}),s=ids.filter(function(i){return ITEMS[i].k==='s'&&ITEMS[i].zt.length>=3});
  var q=[mkOpts(w[0],'meaning','meaning'),mkOpts(w[1],'listen','listen'),mkOpts(w[2],'meaning','meaning'),mkOpts(w[3],'listen','listen')];
  if(s.length)q.push(mkArr(s[0]));
  if(old.length){var o=pickW(old,1)[0],tt=Math.random()<0.5?'listen':'meaning';q.push(mkOpts(o,tt,tt))}
  return q;
}
function buildQuizFrom(ids,n){
  var a=shuffle(ids).slice(0,n),q=[];
  a.forEach(function(id,i){var it=ITEMS[id];if(it.k==='s'&&it.zt&&it.zt.length>=3&&i%3===2)q.push(mkArr(id));else{var t=i%2?'listen':'meaning';q.push(mkOpts(id,t,t))}});
  return q;
}
function distractIcons(cor,n){var all=ART.list.filter(function(x){return x!==cor&&x!=='clock'});return shuffle(all).slice(0,n)}
function buildPic(day){
  var D=dayOf(day),q=[],ws=D.ids.filter(function(i){return iconFor(i)});
  shuffle(ws).slice(0,3).forEach(function(id){var cor=iconFor(id);q.push({type:'pic',skill:'listen',id:id,ans:cor,opts:shuffle([cor].concat(distractIcons(cor,3)))})});
  var ss=D.ids.filter(function(i){return ITEMS[i].k==='s'});
  ss.slice(0,q.length?1:2).forEach(function(id){q.push(sceneQ(id,day))});
  return q;
}
function sceneQ(id,day){
  var sig=ART.sig(day),cand=[];for(var d=1;d<=60;d++){if(d!==day&&dayOf(d).ty==='learn'&&ART.sig(d)!==sig)cand.push(d)}
  var seen={},opts=[day];shuffle(cand).forEach(function(d){var s=ART.sig(d);if(!seen[s]&&opts.length<3){seen[s]=1;opts.push(d)}});
  return {type:'scene',skill:'meaning',id:id,ans:day,opts:shuffle(opts)};
}
function stripZ(t){return String(t).replace(/[，。？！、…,.?!\s]/g,'')}
/* đáp án nhiễu không được là một câu trả lời cũng hợp lý: loại câu chứa lời chào/đáp giống đáp án, câu đáp cho cùng một lời mời, và câu có cùng mẫu mở đầu */
function okDis(x,ans,prompt){
  var a=stripZ(ITEMS[ans].zh),b=stripZ(ITEMS[x].zh),p=prompt?stripZ(ITEMS[prompt].zh):'';
  if(!b||a.indexOf(b)>=0||b.indexOf(a)>=0)return false;
  if(a.slice(0,2)===b.slice(0,2))return false;
  var G=['你好','您好','早上好','谢谢','再见','对不起','没关系','不客气','好久不见'];
  for(var g=0;g<G.length;g++){if(b.indexOf(G[g])===0&&(p.indexOf(G[g])>=0||a.indexOf(G[g])>=0))return false}
  var it=ITEMS[x],D=dayOf(it.day),k=D.lines.indexOf(x);
  if(k>0&&p&&stripZ(ITEMS[D.lines[k-1]].zh)===p)return false;
  return true;
}
function buildTalk(day){
  var D=dayOf(day),q=[],L=D.lines;
  var others=[];DAYS.forEach(function(x){if(x.d!==day&&x.ty==='learn')others.push(x)});
  function otherLines(who){var a=[];others.forEach(function(x){(x.lines||[]).forEach(function(id){if(ITEMS[id].who===who)a.push(id)})});return a}
  function otherSents(){var a=[];others.forEach(function(x){x.ids.forEach(function(id){if(ITEMS[id].k==='s')a.push(id)})});return a}
  if(L.length>=2){
    var n=0;L.forEach(function(id,i){if(n<2&&i>0&&ITEMS[id].who==='B'){
      var dis=shuffle(otherLines('B')).filter(function(x){return okDis(x,id,L[i-1])}).slice(0,2);if(dis.length<2)dis=dis.concat(shuffle(otherSents()).slice(0,2-dis.length));
      q.push({type:'reply',skill:'arrange',id:id,prompt:L[i-1],ans:id,opts:shuffle([id].concat(dis))});n++}});
  }
  var ss=D.ids.filter(function(i){return ITEMS[i].k==='s'});
  ss.slice(0,L.length>=2?1:2).forEach(function(id){var dis=shuffle(otherSents()).filter(function(x){return okDis(x,id,null)}).slice(0,2);q.push({type:'say',skill:'arrange',id:id,ans:id,opts:shuffle([id].concat(dis)),day:day})});
  return q;
}
function buildTest(day){
  var D=dayOf(day),mil=D.ty==='milestone',c=mil?{listen:6,meaning:6,arrange:4,speak:4}:{listen:4,meaning:4,arrange:3,speak:3};
  var pool=poolIds(D.range,true),note='';
  if(pool.length<8){pool=poolIds(D.range,false);note='Bạn chưa hoàn thành nhiều ngày trong khoảng này, nên bài kiểm tra lấy cả những mục chưa học. Kết quả sẽ thấp hơn bình thường.'}
  var sents=pool.filter(function(i){return ITEMS[i].k==='s'&&ITEMS[i].zt.length>=3});
  var allSents=pool.filter(function(i){return ITEMS[i].k==='s'});
  var used={};function take(src,n){var r=pickW(src.filter(function(i){return !used[i]}),n);if(r.length<n)r=r.concat(pickW(src.filter(function(i){return r.indexOf(i)<0}),n-r.length));r.forEach(function(i){used[i]=1});return r}
  var qs=[];
  take(pool,c.listen).forEach(function(i){qs.push(mkOpts(i,'listen','listen'))});
  take(pool,c.meaning).forEach(function(i){qs.push(mkOpts(i,'meaning','meaning'))});
  take(sents,c.arrange).forEach(function(i){qs.push(mkArr(i))});
  return {qs:interleave(qs),speakIds:take(allSents.length?allSents:pool,c.speak),sp:[],note:note,res:null};
}
function interleave(q){var g={};q.forEach(function(x){(g[x.skill]=g[x.skill]||[]).push(x)});var out=[],k=Object.keys(g),i=0;while(out.length<q.length){var a=g[k[i%k.length]];if(a&&a.length)out.push(a.shift());i++;if(i>500)break}return out}

  if(t.note)h+='<div class="card warn small">'+esc(t.note)+'</div>';
  var can=[],weak=[],mid=[];
  ['listen','meaning','arrange','speak'].forEach(function(k){var p=pct(t.sc[k]);if(p===null)return;var l=SK[k].toLowerCase();if(p>=80)can.push(l);else if(p>=60)mid.push(l);else weak.push(l)});
  h+='<div class="card"><h3>Bạn làm được gì, còn yếu gì</h3><ul class="plain">'+(can.length?'<li>Khá tốt: '+can.join(', ')+'.</li>':'')+(mid.length?'<li>Tạm ổn, cần thêm lần nghe và ôn: '+mid.join(', ')+'.</li>':'')+(weak.length?'<li>Còn yếu: '+weak.join(', ')+'.</li>':'')+'</ul></div>';
  if(t.weak.length){h+='<div class="card"><h3>Buổi tiếp theo cần ôn</h3><p class="muted small">Các mục sai, đã được xếp ôn lại vào ngày mai:</p>';t.weak.slice(0,6).forEach(function(id){var it=ITEMS[id];h+='<div class="line">'+iconBox(id,1)+'<div style="flex:1;min-width:0"><div class="hz s">'+esc(it.zh)+'</div><div class="py">'+esc(it.py)+'</div><div class="muted small">'+esc(it.vi)+'</div></div><button class="btn sm sec" onclick="A.say(\''+id+'\')">Nghe</button></div>'});h+='</div>'}
  h+=st.consol?'<div class="card warn"><b>Nên củng cố trước khi tăng độ khó.</b><p class="small">Buổi tiếp theo nên ôn các mục yếu, chưa thêm từ mới.</p></div>':'<div class="card good"><b>Nền tảng đủ để đi tiếp.</b><p class="small">Bạn vẫn nên giữ ôn bài đến hạn mỗi buổi.</p></div>';
  h+='<button class="btn" onclick="A.go(\'today\')">Tiếp tục</button>'+(S.day===60?'<button class="btn ghost" onclick="A.go(\'post\')">Xem gợi ý sau ngày 60</button>':'');
  return h;
}

/* ================= HÀNH ĐỘNG ================= */
function curQ(){return qlist()[S.qi]}
function autoPlay(){var q=S&&qlist&&(['pic','talk','test'].indexOf(step())>=0)?curQ():null;if(q&&(q.type==='listen'||q.type==='pic'||q.type==='scene')&&hasVoice()){setTimeout(function(){speakP(ITEMS[q.id].zh)},200)}}
function recordQ(q,ok){
  var key=qkey();if(S.res[key])return;
  S.res[key]={id:q.id,ok:ok,t:q.type};quizMark(q.id,ok);save();
}
var A={
  go:go,
  recFile:function(inp){var f=inp.files&&inp.files[0];if(!f)return;try{if(Rec.url)URL.revokeObjectURL(Rec.url)}catch(e){}Rec.url=URL.createObjectURL(f);Rec.state='ready';Rec.msg='';render()},
  vid:function(d){vidOpen[d]=1;render()},
  say:function(id,slow){say(ITEMS[id].zh,slow)},
  sayT:function(el,slow,txt){say(txt||(el&&el.getAttribute('data-t')),slow)},
  unmask:function(el){el.classList.remove('mask');el.textContent=el.getAttribute('data-t');el.onclick=null},
  start:function(m,d){startSession(m,d)},
  resume:function(){if(st.sess&&st.sess.mode){S=st.sess;render()}},
  dropSess:function(){st.sess=null;save();render()},
  toggle:function(i){var nd=nextDay(),cur=-1;CHANG.forEach(function(c,j){if(nd>=c.a&&nd<=c.b)cur=j});var isOpen=UI.open===null?cur===i:UI.open===i;UI.open=isOpen?-1:i;render()},
  exit:function(v){
    if(v===undefined){exitAsk=true;render();return}
    if(v==='save'){S=null;exitAsk=false;recReset();clipStop();go('today');return}
    if(v==='drop'){st.sess=null;save();S=null;exitAsk=false;recReset();clipStop();go('today');return}
    exitAsk=false;render();
  },
  back:function(){if(S.si>0){S.si--;resetStep();render()}},
  next:function(){
    var s=step();
    if(s==='hear'){S.lq.forEach(function(id){ensure(id)});save()}
    if(s==='speak'&&S.mode==='test')finishTest();
    var nxt=S.steps[S.si+1];
    if(nxt==='result'&&!(S.mode==='test'&&s==='speak')){finalize()}
    if(nxt==='result'&&S.mode==='test'&&s==='test'){}
    if(nxt==='result'){st.sess=null;save()}
    S.si++;resetStep();
    if(nxt==='result'){st.sess=null;save()}
    render();
    if(nxt==='pic'||nxt==='talk'||nxt==='test')autoPlay();
  },
  hint:function(){S.rev=1;render()},
  reveal:function(){S.rev=2;render()},
  reveal2:function(){S.revealed=true;render()},
  tokTap:function(i){S.tokSel=i;render()},
  clip:function(){clipPlay()},
  clipStop:function(){clipStop();render()},
  nextLearn:function(){var id=S.lq[S.li];ensure(id);save();S.li++;S.revealed=false;S.tokSel=null;render()},
  rate:function(r){
    var kind=step()==='due'?'due':'recall',q=kind==='due'?S.dueQ:S.rq,id=q[S.ci];
    rate(id,r,kind==='recall');S.rr.push({id:id,r:r});
    if(r===0&&!S.req[id]&&kind==='due'){S.req[id]=1;q.push(id)}
    save();S.ci++;S.rev=0;render();
  },
  spk:function(r){
    var list=(step()==='speak'&&S.mode==='test')?S.T.speakIds:S.sh,id=list[S.pi];
    (st.speak[id]=st.speak[id]||[]).push(r);if(st.speak[id].length>5)st.speak[id].shift();
    if(step()==='speak'&&S.mode==='test')S.T.sp.push(r);
    if(r===0&&ITEMS[id].k!=='l'){ensure(id).last=0}
    save();S.pi++;S.shDone=true;recReset();render();
  },
  rec:recToggle,
  pick:function(i){
    var q=curQ(),it=ITEMS[q.id],ok;
    if(q.type==='listen'||q.type==='meaning')ok=q.opts[i]===it.vi;else ok=q.opts[i]===q.ans;
    S.picked=i;S.lastOK=ok;recordQ(q,ok);render();
  },
  retry:function(){S.picked=null;S.lastOK=null;render();autoPlay()},
  tok:function(i){S.arr=S.arr||[];if(S.arr.indexOf(i)<0){S.arr.push(i);render()}},
  undo:function(){if(S.arr&&S.arr.length){S.arr.pop();render()}},
  checkArr:function(){var q=curQ(),ok=S.arr.every(function(v,i){return ITEMS[q.id].zt[v]===ITEMS[q.id].zt[i]});S.picked=ok?1:0;S.lastOK=ok;recordQ(q,ok);render()},
  nextQ:function(){S.qi++;S.picked=null;S.arr=null;S.lastOK=null;render();autoPlay()},
  tg:function(k,v){st.set[k]=v;if(!st.set.hanzi&&!st.set.pinyin){st.set.pinyin=true;toast('Cần giữ ít nhất chữ Hán hoặc pinyin để học được.')}save();render()},
  setStart:function(v){if(v){st.start=v;save();render()}},
  setTime:function(v){if(v){st.time=v;save();render()}},
  setTrack:function(k){st.set.track=k;save();toast('Đã chọn hướng: '+POST.tracks[k].label)},
  exportData:function(){
    var copy=JSON.parse(JSON.stringify(st));copy.sess=null;
    var txt=JSON.stringify(copy,null,1),name='hoc-tieng-trung-'+today()+'.json';
    function local(){try{var u=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Đã tạo file sao lưu '+name)}catch(e){A.copyData()}}
    if(!(window.claude&&claude.use)){local();return}
    claude.use('downloads').then(function(d){
      if(!d){A.copyData();return}
      return d.save({filename:name,data:txt}).then(function(){toast('Đã lưu file sao lưu.')}).catch(function(e){if(e&&e.code==='declined')return;A.copyData()});
    }).catch(function(){A.copyData()});
  },
  copyData:function(){
    var copy=JSON.parse(JSON.stringify(st));copy.sess=null;var txt=JSON.stringify(copy);
    function fallback(){var ta=$('impTxt');if(ta){ta.value=txt;ta.focus();ta.select()}if($('impMsg'))$('impMsg').textContent='Nội dung sao lưu đã điền vào ô bên dưới. Hãy chọn tất cả, sao chép và lưu vào nơi an toàn.'}
    try{navigator.clipboard.writeText(txt).then(function(){toast('Đã sao chép bản sao lưu. Dán vào ghi chú hoặc file để cất.')}).catch(fallback)}catch(e){fallback()}
  },
  importFile:function(inp){var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){doImport(String(r.result))};r.readAsText(f)},
  importText:function(){doImport($('impTxt').value)},
  resetAsk:function(){$('rstBox').innerHTML='<p class="small"><b>Xóa toàn bộ tiến độ trên thiết bị này?</b> Không thể hoàn tác.</p><div class="row"><button class="btn sm dng" onclick="A.reset()">Xóa hết</button><button class="btn sm sec" onclick="A.go(\'settings\')">Không xóa</button></div>'},
  reset:function(){st=defState();save();toast('Đã xóa tiến độ.');go('today')}
};
function doImport(txt){
  var m=$('impMsg');
  try{
    var o=JSON.parse(txt);
    if(!o||typeof o!=='object'||o.v!==1||typeof o.done!=='object'||typeof o.srs!=='object')throw 0;
    var s=defState();for(var k in o){if(k==='set'){for(var j in o.set)s.set[j]=o.set[j]}else s[k]=o[k]}
    s.sess=null;st=s;save();toast('Đã nhập bản sao lưu.');go('today');
  }catch(e){if(m)m.textContent='Nội dung không phải bản sao lưu hợp lệ của ứng dụng này.'}
}
window.A=A;

/* khởi động */
(function(){var h=(location.hash||'').replace('#','');if(ROUTES.indexOf(h)>=0)UI.tab=h;render();syncInit()})();
window.addEventListener('hashchange',function(){if(S)return;var h=(location.hash||'').replace('#','');if(ROUTES.indexOf(h)>=0&&h!==UI.tab){UI.tab=h;render()}});
})();
</script></body></html>
